[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-shift-left"
version = "0.1.0"
description = "Agent-driven Power BI shift-left orchestration foundation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
entra = ["azure-identity>=1.25"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "PyJWT[crypto]>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]
